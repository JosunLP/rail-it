[scenario]
name = "Redundanz 2-von-3: Kanalausfall, Wiederaufnahme, Abschaltung, Rücksetzen"
description = """
Das Stellwerk rechnet in drei Kanälen; der Voter gibt nur weiter, was zwei Kanäle
übereinstimmend berechnet haben. Fällt ein Kanal aus oder rechnet er falsch, wird er
ausgeschlossen und der Betrieb läuft unverändert weiter. Nach der Wiederaufnahme wählt er
wieder mit. Fallen zwei Kanäle aus, schaltet die Sicherheitsschicht ab: Alle Signale zeigen
Halt, Anforderungen werden abgelehnt. Nach dem Rücksetzen beginnt das Stellwerk wie nach
einem Neustart.
"""
network = "../../examples/beispielstadt.toml"
channels = 3

[[step]]
note = "Zug vor A, alle drei Kanäle wählen mit"
add_train = { name = "RE1", signal = "A", length_m = 120, speed_kmh = 60 }
wait_s = 1
expect = { active_channels = [true, true, true], safety_trip = false }

[[step]]
note = "Kanal 2 steht still: Er wird ausgeschlossen, der Betrieb läuft weiter"
channel_fault = { channel = 2, fault = "stall" }
wait_s = 1
expect = { safety_event = ["channel_excluded"], active_channels = [true, true, false], safety_trip = false }

[[step]]
note = "Einfahrt A-N1 mit den beiden übrigen Kanälen (2-von-2)"
set_route = "A-N1"
until = { route = { "A-N1" = "proceed" } }
timeout_s = 15
expect = { accepted = true, signal = { A = "proceed" } }

[[step]]
note = "Der Zug fährt ein"
until = { route = { "A-N1" = "idle" }, train = { RE1 = "waiting" } }
timeout_s = 240
expect = { safety_trip = false, tvd = { T1 = "occupied" } }

[[step]]
note = "Kanal 2 übernimmt den Zustand eines gesunden Kanals und wählt wieder mit"
reintegrate = { channel = 2 }
wait_s = 2
expect = { active_channels = [true, true, true], safety_trip = false }

[[step]]
note = "Kanal 0 gibt einen falschen Fahrtbefehl aus: überstimmt und ausgeschlossen"
channel_fault = { channel = 0, fault = "stray_command" }
wait_s = 1
expect = { safety_event = ["channel_excluded"], active_channels = [false, true, true], safety_trip = false }

[[step]]
note = "Kanal 1 steht still: Ohne zwei übereinstimmende Kanäle schaltet die Schicht ab"
channel_fault = { channel = 1, fault = "stall" }
wait_s = 1
expect = { safety_event = ["tripped"], safety_trip = true, safe_state = true, signal = { A = "stop", N1 = "stop" } }

[[step]]
note = "Im sicheren Zustand werden Anforderungen abgelehnt"
set_route = "N1-GE"
wait_s = 1
expect = { accepted = false, rejected = "safe_state", signal = { N1 = "stop" } }

[[step]]
note = "Rücksetzen: alle Kanäle wie nach einem Neustart, Ausfahrt wieder möglich"
reset_safety = true
wait_s = 2
expect = { safety_trip = false, safe_state = false, active_channels = [true, true, true] }

[[step]]
set_route = "N1-GE"
until = { route = { "N1-GE" = "proceed" } }
timeout_s = 15
expect = { accepted = true }

[[step]]
note = "Der Zug verlässt den Bahnhof"
until = { train = { RE1 = "left" } }
timeout_s = 240
expect = { safety_trip = false }
