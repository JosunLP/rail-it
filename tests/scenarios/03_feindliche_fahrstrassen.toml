[scenario]
name = "Feindliche Fahrstraßen und besetzte Abschnitte"
network = "../../examples/beispielstadt.toml"

[[step]]
set_route = "A-N1"
until = { route = { "A-N1" = "proceed" } }
timeout_s = 15

[[step]]
note = "A-N2 teilt Startsignal und Weiche W1"
set_route = "A-N2"
expect = { rejected = "conflict", route = { "A-N2" = "idle" } }

[[step]]
note = "F-P1 führt in das Gleis, in das A-N1 einfährt"
set_route = "F-P1"
expect = { rejected = "conflict" }

[[step]]
note = "N2-GE kreuzt den Durchrutschweg von A-N1 (W2 rechts statt links)"
set_route = "N2-GE"
expect = { rejected = "conflict" }

[[step]]
note = "N1-GE setzt A-N1 fort und ist verträglich"
set_route = "N1-GE"
until = { route = { "N1-GE" = "proceed" } }
timeout_s = 15
expect = { signal = { A = "proceed", N1 = "proceed" } }

[[step]]
note = "Rücknahme mit Fahrt: Zeitverschluss läuft"
cancel_route = "A-N1"
expect = { accepted = true, route = { "A-N1" = "cancelling" }, signal = { A = "stop" } }

[[step]]
note = "Abschnitt hinter W2 wird besetzt gemeldet: N1 fällt auf Halt"
fault = { kind = "tvd_occupied", element = "TE" }
expect = { route = { "N1-GE" = "halted" }, signal = { N1 = "stop" }, alarm = ["signal_dropped"] }

[[step]]
note = "N1-GE zurücknehmen; beide Zeitverschlüsse laufen ab"
cancel_route = "N1-GE"
wait_s = 61
expect = { route = { "A-N1" = "idle", "N1-GE" = "idle" } }

[[step]]
note = "Gleis 2 ist besetzt: A-N2 nicht möglich"
fault = { kind = "tvd_occupied", element = "T2" }
set_route = "A-N2"
expect = { rejected = "tvd_not_clear" }
