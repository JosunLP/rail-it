# Beispielstadt – kleiner Durchgangsbahnhof mit zwei Bahnsteiggleisen.
#
#    a ▷         A ▶                       N1 ▶     BÜ1        ◀ F       ◁ f
#   GW ════ west ════ W1 ╤════ 1 ════╤ W2 ════ east ══╪═══════════ GE
#                        ╘════ 2 ════╛
#                         ◀ P1/P2   N2 ▶
#
# Westseite im Ks-System: Vorsignal a, Einfahrsignal A (Mehrabschnittssignal), Ausfahrsignale
# N1/N2. Ostseite im H/V-System: Vorsignal f, Einfahrsignal F (Hauptsignal mit Vorsignal am
# Mast), Ausfahrsignale P1/P2. Gleis 2 liegt jeweils im abzweigenden Strang (40 km/h).
# Auf der Ostseite kreuzt der Bahnübergang BÜ1 die Strecke.
#
# Hauptsignale stehen am Gleisende und damit an einer Gleisfreimeldegrenze (REQ-PLN-010).

[network]
name = "Beispielstadt"

[[terminal]]
name = "GW"
kind = "boundary"

[[terminal]]
name = "GE"
kind = "boundary"

[[track]]
name = "west"
length_m = 1000

[[track]]
name = "1"
length_m = 600

[[track]]
name = "2"
length_m = 600

[[track]]
name = "east"
length_m = 1000

[[point]]
name = "W1"
diverging = "right"
diverging_speed_kmh = 40

[[point]]
name = "W2"
diverging = "right"
diverging_speed_kmh = 40

[[link]]
from = "GW.end"
to = "west.a"

[[link]]
from = "west.b"
to = "W1.tip"

[[link]]
from = "W1.left"
to = "1.a"

[[link]]
from = "W1.right"
to = "2.a"

[[link]]
from = "1.b"
to = "W2.left"

[[link]]
from = "2.b"
to = "W2.right"

[[link]]
from = "W2.tip"
to = "east.a"

[[link]]
from = "east.b"
to = "GE.end"

[[signal]]
name = "A"
track = "west"
position_m = 1000
direction = "a_to_b"
kind = "combined"
system = "ks"

[[signal]]
name = "N1"
track = "1"
position_m = 600
direction = "a_to_b"
kind = "main"
system = "ks"

[[signal]]
name = "N2"
track = "2"
position_m = 600
direction = "a_to_b"
kind = "main"
system = "ks"

[[signal]]
name = "F"
track = "east"
position_m = 0
direction = "b_to_a"
kind = "combined"
system = "hv"

[[signal]]
name = "P1"
track = "1"
position_m = 0
direction = "b_to_a"
kind = "main"
system = "hv"

[[signal]]
name = "P2"
track = "2"
position_m = 0
direction = "b_to_a"
kind = "main"
system = "hv"

[[signal]]
name = "a"
track = "west"
position_m = 0
direction = "a_to_b"
kind = "distant"
system = "ks"

[[signal]]
name = "f"
track = "east"
position_m = 1000
direction = "b_to_a"
kind = "distant"
system = "hv"

[[level_crossing]]
name = "BÜ1"
track = "east"
position_m = 500

[[tvd]]
name = "TW"
elements = ["west"]

[[tvd]]
name = "TW1"
elements = ["W1"]

[[tvd]]
name = "T1"
elements = ["1"]

[[tvd]]
name = "T2"
elements = ["2"]

[[tvd]]
name = "TW2"
elements = ["W2"]

[[tvd]]
name = "TE"
elements = ["east"]
