[package]
name = "railit-embedded"
description = "Embedded-Runtime von rail-it für den sicheren Rechner (Cortex-R): Kern in redundanten Kanälen, Zyklus per Timer, Ein- und Ausgaben als Binärtelegramme über RaSTA; ohne std und ohne Allokation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
railit-types = { workspace = true, features = ["serde"] }
railit-plan = { workspace = true }
railit-rules = { workspace = true }
railit-kernel = { workspace = true, features = ["serde"] }
railit-safety = { workspace = true, features = ["serde"] }
railit-rasta = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

[features]
default = []
# Gegenstelle auf dem Server (railitd, Tests): sammelt Ausgaben in Vec.
host = []

[dev-dependencies]
railit-embedded = { path = ".", features = ["host"] }
railit-kernel = { workspace = true, features = ["alloc", "serde"] }
railit-plan = { workspace = true, features = ["alloc"] }
railit-planning = { workspace = true }
railit-import = { workspace = true }

[lints]
workspace = true
