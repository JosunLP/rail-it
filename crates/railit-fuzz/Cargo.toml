[package]
name = "railit-fuzz"
description = "Fuzz-Ziele von rail-it: Plan-Image, Netzformate, Fahrplan, Journal, RaSTA, EULYNX SCI, Binärprotokoll des sicheren Rechners. Von cargo-fuzz (fuzz/) und von Tests mit Startkorpus genutzt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
railit-types = { workspace = true }
railit-topology = { workspace = true }
railit-plan = { workspace = true, features = ["alloc"] }
railit-planning = { workspace = true }
railit-import = { workspace = true }
railit-rules = { workspace = true }
railit-kernel = { workspace = true, features = ["alloc"] }
railit-movement = { workspace = true }
railit-journal = { workspace = true }
railit-ops = { workspace = true }
railit-rasta = { workspace = true }
railit-adapters = { workspace = true }
railit-embedded = { workspace = true, features = ["host"] }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
