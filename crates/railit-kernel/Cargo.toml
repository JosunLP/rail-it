[package]
name = "railit-kernel"
description = "Sicherheitskern von rail-it: Fahrwegsicherung als deterministische Zustandsmaschine (no_std, ohne alloc)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
railit-types = { workspace = true }
railit-plan = { workspace = true }
railit-rules = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
# Zustandsspeicher und Ausgabepuffer auf Basis von Vec (Server).
alloc = []
serde = ["dep:serde", "railit-types/serde"]

[dev-dependencies]
railit-plan = { workspace = true, features = ["alloc"] }
railit-planning = { workspace = true }
railit-import = { workspace = true }
proptest = { workspace = true }

[[test]]
name = "kernel"
required-features = ["alloc"]

[[test]]
name = "invariants"
required-features = ["alloc"]

[[test]]
name = "phase2"
required-features = ["alloc"]

[lints]
workspace = true
