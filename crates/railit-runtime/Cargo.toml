[package]
name = "railit-runtime"
description = "Laufzeit von rail-it: koppelt Sicherheitskern und Feldebene im Zyklus, liefert Zustandsbilder und führt Szenarien aus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
railit-types = { workspace = true, features = ["serde"] }
railit-topology = { workspace = true }
railit-plan = { workspace = true, features = ["alloc"] }
railit-planning = { workspace = true }
railit-import = { workspace = true }
railit-rules = { workspace = true }
railit-kernel = { workspace = true, features = ["alloc", "serde"] }
railit-sim = { workspace = true }
serde = { workspace = true, features = ["std"] }
toml = { workspace = true }

[lints]
workspace = true
