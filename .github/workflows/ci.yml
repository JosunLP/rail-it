name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: "1.97.0"

jobs:
  check:
    name: Format, Lints, Tests, Doku
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain installieren
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Doku
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  properties:
    name: Eigenschaftstests (Kern, RaSTA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain installieren
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Invarianten und Erlaubniswechsel (je 5000 Fälle)
        run: >
          cargo test --release --locked -p railit-kernel --all-features
          --test invariants --test borders
        env:
          PROPTEST_CASES: "5000"
      - name: RaSTA unter Verlust, Verdopplung und Vertauschung (5000 Fälle)
        run: cargo test --release --locked -p railit-rasta --test rasta
        env:
          PROPTEST_CASES: "5000"

  no-std:
    name: no_std-Build (Cortex-M)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain installieren
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Sicherheitsrelevante Crates ohne std bauen
        run: >
          cargo build --locked --target thumbv7em-none-eabihf
          -p railit-types -p railit-topology -p railit-plan -p railit-rules -p railit-kernel
          -p railit-movement -p railit-rasta

  deny:
    name: Lizenzen & Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
