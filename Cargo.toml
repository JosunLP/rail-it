[workspace]
resolver = "3"
members = [
    "crates/railit-types",
    "crates/railit-topology",
    "crates/railit-plan",
    "crates/railit-planning",
    "crates/railit-import",
    "apps/railit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
repository = "https://github.com/JosunLP/rail-it"
authors = ["Jonas Pfalzgraf"]
publish = false

[workspace.dependencies]
railit-types = { path = "crates/railit-types" }
railit-topology = { path = "crates/railit-topology" }
railit-import = { path = "crates/railit-import" }
railit-plan = { path = "crates/railit-plan" }
railit-planning = { path = "crates/railit-planning" }

serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
proptest = "1"
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
