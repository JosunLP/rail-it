[workspace]
resolver = "3"
# cargo-fuzz (nightly) hat einen eigenen Workspace.
exclude = ["fuzz"]
members = [
    "crates/railit-types",
    "crates/railit-topology",
    "crates/railit-plan",
    "crates/railit-planning",
    "crates/railit-rules",
    "crates/railit-kernel",
    "crates/railit-safety",
    "crates/railit-embedded",
    "crates/railit-fuzz",
    "crates/railit-movement",
    "crates/railit-journal",
    "crates/railit-sim",
    "crates/railit-ops",
    "crates/railit-etcs",
    "crates/railit-rasta",
    "crates/railit-adapters",
    "crates/railit-runtime",
    "crates/railit-import",
    "crates/railit-layout",
    "apps/railit",
    "apps/railitd",
    "apps/railit-node",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
repository = "https://github.com/JosunLP/rail-it"
authors = ["Jonas Pfalzgraf"]
publish = false

[workspace.dependencies]
railit-types = { path = "crates/railit-types" }
railit-topology = { path = "crates/railit-topology" }
railit-import = { path = "crates/railit-import" }
railit-layout = { path = "crates/railit-layout" }
railit-plan = { path = "crates/railit-plan" }
railit-planning = { path = "crates/railit-planning" }
railit-rules = { path = "crates/railit-rules" }
railit-kernel = { path = "crates/railit-kernel" }
railit-safety = { path = "crates/railit-safety" }
railit-embedded = { path = "crates/railit-embedded" }
railit-movement = { path = "crates/railit-movement" }
railit-sim = { path = "crates/railit-sim" }
railit-journal = { path = "crates/railit-journal" }
railit-ops = { path = "crates/railit-ops" }
railit-etcs = { path = "crates/railit-etcs" }
railit-rasta = { path = "crates/railit-rasta" }
railit-adapters = { path = "crates/railit-adapters" }
railit-runtime = { path = "crates/railit-runtime" }

serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
toml = "0.9"
roxmltree = "0.21"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
sha2 = { version = "0.10", default-features = false }
postcard = { version = "1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["json"] }
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
x509-parser = "0.18"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tonic = { version = "0.14", default-features = false, features = ["router", "codegen", "server"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
protox = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(fuzzing)"] }
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
