# Prüfung der Abhängigkeiten mit cargo-deny.
#
# rail-it steht unter der Non-Commercial Source License (NCSL) v1.0. Damit die Lizenz
# wirksam bleibt, sind nur freizügige Lizenzen für Abhängigkeiten zulässig; Copyleft
# (GPL, LGPL, AGPL, …) ist ausgeschlossen (Konzept, Abschnitt 17).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Eigene Crates tragen die NCSL (keine SPDX-Kennung) und sind nicht veröffentlicht.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
