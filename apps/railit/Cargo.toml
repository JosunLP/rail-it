[package]
name = "railit"
description = "Kommandozeile von rail-it: Netze und Pläne prüfen, Szenarien ausführen, railitd bedienen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "railit"
path = "src/main.rs"

[dependencies]
railit-import = { workspace = true }
railit-topology = { workspace = true }
railit-plan = { workspace = true, features = ["alloc"] }
railit-planning = { workspace = true }
railit-runtime = { workspace = true }
railit-journal = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
railit-kernel = { workspace = true }
railit-rules = { workspace = true }
railit-sim = { workspace = true }
railit-types = { workspace = true }

[lints]
workspace = true
