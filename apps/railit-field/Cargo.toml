[package]
name = "railit-field"
description = "Feldrechner von rail-it: simulierte Objektsteuerungen hinter EULYNX SCI und RaSTA über UDP, mit Umschalter zwischen Haupt- und Bereitschaftsrechner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "railit-field"
path = "src/main.rs"

[dependencies]
railit-adapters = { workspace = true }
railit-import = { workspace = true }
railit-sim = { workspace = true }
railit-topology = { workspace = true }
railit-types = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
ureq = { workspace = true }

[lints]
workspace = true
